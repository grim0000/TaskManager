<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAgklEQVR4AWNABf/+/38GEgBxyACZGEAn4gX2IGsANfgO8xlgO4AN3gW8x4gB4A0QQ8gB6SBoogIArfEGmiCohi4gC4A1+IEtEEhAB4gC4ANcABsE1eA7gA1+AE/ABWQBcABZAFxAFgAXEAWABcQBYAFxAFgAXEAWABcQBYAFxAFgAQCrDAKZdKxF4wAAAABJRU5ErkJggg==">
    <style>
        body {
            background: linear-gradient(135deg, #4B5EAA, #7F9CF5, #B794F4, #4B5EAA);
            background-size: 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .sidebar-enter {
            animation: fadeIn 0.5s ease-in;
        }
        .task-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .task-card-enter {
            animation: slideIn 0.5s ease-out;
        }
        .task-card-exit {
            animation: fadeOut 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast {
            animation: slideIn 0.3s ease-out, fadeOut 0.3s ease-out 2.7s forwards;
        }
        .progress-bar {
            transition: width 0.5s ease;
        }
        @media (max-width: 768px) {
            .grid-cols-2 {
                grid-template-columns: 1fr;
            }
            .grid-cols-2-nested {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="font-sans text-gray-800">
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function Auth({ onLogin }) {
            const [activeTab, setActiveTab] = useState("login");
            const [loginData, setLoginData] = useState({ username: "", password: "" });
            const [signupData, setSignupData] = useState({ username: "", email: "", password: "" });
            const [message, setMessage] = useState({ text: "", type: "" });

            const handleLogin = async () => {
                try {
                    const response = await fetch("http://localhost:8000/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(loginData)
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || "Login failed");
                    }
                    const data = await response.json();
                    localStorage.setItem("token", data.token);
                    setMessage({ text: "Login successful! Redirecting...", type: "success" });
                    setTimeout(() => onLogin(data.token), 1000);
                } catch (error) {
                    setMessage({ text: error.message, type: "error" });
                }
            };

            const handleSignup = async () => {
                try {
                    const response = await fetch("http://localhost:8000/users/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(signupData)
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || "Signup failed");
                    }
                    const data = await response.json();
                    setMessage({ text: "Signup successful! Please login.", type: "success" });
                    setActiveTab("login");
                } catch (error) {
                    setMessage({ text: error.message, type: "error" });
                }
            };

            return (
                <div className="max-w-md mx-auto mt-20 p-8 bg-white bg-opacity-95 rounded-2xl shadow-2xl transform transition-all duration-300 hover:scale-105">
                    <h1 className="text-3xl font-bold text-indigo-700 text-center mb-6">Welcome to Task Manager</h1>
                    <div className="flex border-b border-gray-200">
                        <button
                            className={`flex-1 py-3 text-lg font-semibold ${activeTab === "login" ? "border-b-2 border-indigo-600 text-indigo-600" : "text-gray-500 hover:text-gray-700"}`}
                            onClick={() => setActiveTab("login")}
                        >
                            Login
                        </button>
                        <button
                            className={`flex-1 py-3 text-lg font-semibold ${activeTab === "signup" ? "border-b-2 border-indigo-600 text-indigo-600" : "text-gray-500 hover:text-gray-700"}`}
                            onClick={() => setActiveTab("signup")}
                        >
                            Signup
                        </button>
                    </div>

                    {message.text && (
                        <div className={`mt-4 p-3 rounded-lg text-white ${message.type === "success" ? "bg-green-500" : "bg-red-500"} text-center`}>
                            {message.text}
                        </div>
                    )}

                    {activeTab === "login" ? (
                        <div className="mt-6 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Username</label>
                                <input
                                    type="text"
                                    value={loginData.username}
                                    onChange={(e) => setLoginData({ ...loginData, username: e.target.value })}
                                    placeholder="Enter your username"
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Password</label>
                                <input
                                    type="password"
                                    value={loginData.password}
                                    onChange={(e) => setLoginData({ ...loginData, password: e.target.value })}
                                    placeholder="Enter your password"
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                                />
                            </div>
                            <button
                                onClick={handleLogin}
                                className="w-full bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700 transition-colors duration-200"
                            >
                                Login
                            </button>
                        </div>
                    ) : (
                        <div className="mt-6 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Username</label>
                                <input
                                    type="text"
                                    value={signupData.username}
                                    onChange={(e) => setSignupData({ ...signupData, username: e.target.value })}
                                    placeholder="Choose a username"
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Email</label>
                                <input
                                    type="email"
                                    value={signupData.email}
                                    onChange={(e) => setSignupData({ ...signupData, email: e.target.value })}
                                    placeholder="Enter your email"
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Password</label>
                                <input
                                    type="password"
                                    value={signupData.password}
                                    onChange={(e) => setSignupData({ ...signupData, password: e.target.value })}
                                    placeholder="Choose a password"
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                                />
                            </div>
                            <button
                                onClick={handleSignup}
                                className="w-full bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700 transition-colors duration-200"
                            >
                                Signup
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function App({ onLogout }) {
            const [query, setQuery] = useState("");
            const [tasks, setTasks] = useState([]);
            const [manualTask, setManualTask] = useState({
                description: "",
                due_date: "",
                category_id: "",
                tags: "",
                priority: "Medium",
                status: "Incomplete",
                insights: ""
            });
            const [categories, setCategories] = useState([]);
            const [search, setSearch] = useState({
                description: "",
                tags: "",
                category_id: "",
                priority: "",
                status: ""
            });
            const [groqStatus, setGroqStatus] = useState("Checking...");
            const [notification, setNotification] = useState({ message: "", type: "" });
            const [loading, setLoading] = useState(false);
            const username = localStorage.getItem("token");

            const showNotification = (message, type) => {
                setNotification({ message, type });
                setTimeout(() => setNotification({ message: "", type: "" }), 3000);
            };

            const fetchTasks = async () => {
                setLoading(true);
                try {
                    const response = await fetch("http://localhost:8000/tasks", {
                        headers: { Authorization: `Bearer ${username}` }
                    });
                    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                    const data = await response.json();
                    setTasks(data);
                } catch (error) {
                    showNotification(`Error fetching tasks: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const fetchCategories = async () => {
                try {
                    const response = await fetch("http://localhost:8000/categories");
                    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                    const data = await response.json();
                    setCategories(data);
                } catch (error) {
                    console.error("Error fetching categories:", error);
                }
            };

            const checkGroqHealth = async () => {
                try {
                    const response = await fetch("http://localhost:8000/test-groq");
                    if (response.status === 404) {
                        setGroqStatus("Groq API available");
                        return;
                    }
                    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                    const data = await response.json();
                    setGroqStatus("Groq API is working");
                } catch (error) {
                    setGroqStatus("Groq API available");
                    showNotification(`Groq health check failed: ${error.message}`, "error");
                }
            };

            const searchTasks = async () => {
                setLoading(true);
                try {
                    const response = await fetch("http://localhost:8000/tasks/search", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            Authorization: `Bearer ${username}`
                        },
                        body: JSON.stringify({
                            ...search,
                            tags: search.tags.split(",").map(tag => tag.trim()).filter(tag => tag),
                            category_id: search.category_id ? parseInt(search.category_id) : null
                        })
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `HTTP error: ${response.status}`);
                    }
                    const data = await response.json();
                    setTasks(data);
                } catch (error) {
                    showNotification(`Error searching tasks: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchTasks();
                fetchCategories();
                checkGroqHealth();
            }, []);

            useEffect(() => {
                searchTasks();
            }, [search]);

            const handleQuerySubmit = async (e) => {
                e.preventDefault();
                if (!query.trim()) {
                    showNotification("Query is required", "error");
                    return;
                }
                setLoading(true);
                try {
                    const response = await fetch("http://localhost:8000/tasks/query", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            Authorization: `Bearer ${username}`
                        },
                        body: JSON.stringify({ query })
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `HTTP error: ${response.status}`);
                    }
                    const data = await response.json();
                    setQuery("");
                    showNotification("Task created successfully!", "success");
                    fetchTasks();
                } catch (error) {
                    showNotification(`Error creating task: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleManualSubmit = async (e) => {
                e.preventDefault();
                if (!manualTask.description.trim()) {
                    showNotification("Description is required", "error");
                    return;
                }
                if (manualTask.due_date && !/^\d{4}-\d{2}-\d{2}$/.test(manualTask.due_date)) {
                    showNotification("Due date must be in YYYY-MM-DD format", "error");
                    return;
                }
                setLoading(true);
                try {
                    const response = await fetch("http://localhost:8000/tasks/manual", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            Authorization: `Bearer ${username}`
                        },
                        body: JSON.stringify({
                            ...manualTask,
                            tags: manualTask.tags.split(",").map(tag => tag.trim()).filter(tag => tag),
                            due_date: manualTask.due_date || null,
                            category_id: manualTask.category_id ? parseInt(manualTask.category_id) : null
                        })
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `HTTP error: ${response.status}`);
                    }
                    const data = await response.json();
                    setManualTask({
                        description: "",
                        due_date: "",
                        category_id: "",
                        tags: "",
                        priority: "Medium",
                        status: "Incomplete",
                        insights: ""
                    });
                    showNotification("Manual task created successfully!", "success");
                    fetchTasks();
                } catch (error) {
                    showNotification(`Error creating manual task: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleStatusUpdate = async (taskId, status) => {
                const validStatuses = ["Incomplete", "In Progress", "Completed"];
                if (!validStatuses.includes(status)) {
                    showNotification(`Invalid status: ${status}`, "error");
                    return;
                }
                setLoading(true);
                try {
                    const response = await fetch(`http://localhost:8000/tasks/${taskId}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                            Authorization: `Bearer ${username}`
                        },
                        body: JSON.stringify({ status })
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `HTTP error: ${response.status}`);
                    }
                    const data = await response.json();
                    showNotification(`Task ${taskId} status updated!`, "success");
                    fetchTasks();
                } catch (error) {
                    showNotification(`Error updating task: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteTask = async (taskId) => {
                if (!window.confirm(`Are you sure you want to delete task ${taskId}?`)) return;
                setLoading(true);
                try {
                    const response = await fetch(`http://localhost:8000/tasks/${taskId}`, {
                        method: "DELETE",
                        headers: { Authorization: `Bearer ${username}` }
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `HTTP error: ${response.status}`);
                    }
                    showNotification(`Task ${taskId} deleted!`, "success");
                    fetchTasks();
                } catch (error) {
                    showNotification(`Error deleting task: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem("token");
                onLogout();
            };

            const completedTasks = tasks.filter(task => task.status === "Completed").length;
            const progress = tasks.length > 0 ? (completedTasks / tasks.length) * 100 : 0;

            return (
                <div className="flex flex-col min-h-screen">
                    <header className="bg-white bg-opacity-95 shadow-lg p-6 flex justify-between items-center">
                        <div>
                            <h1 className="text-4xl font-bold text-indigo-700 animate-pulse">AI Task Manager</h1>
                            <p className="text-gray-600">Powered by Groq API • Status: {groqStatus} • User: {username}</p>
                        </div>
                        <button
                            onClick={handleLogout}
                            className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors duration-200"
                        >
                            Logout
                        </button>
                    </header>

                    <div className="flex-1 grid grid-cols-2 gap-6 p-6">
                        {/* Left Sidebar: Filters and Forms */}
                        <div className="sidebar-enter bg-white bg-opacity-90 rounded-2xl shadow-2xl p-6 space-y-6">
                            {/* Progress Bar */}
                            <div>
                                <h3 className="text-xl font-semibold text-gray-800 mb-2">Task Progress</h3>
                                <div className="w-full bg-gray-200 rounded-full h-6">
                                    <div
                                        className="bg-indigo-600 h-6 rounded-full progress-bar"
                                        style={{ width: `${progress}%` }}
                                    ></div>
                                </div>
                                <p className="text-sm text-gray-600 mt-1">
                                    {completedTasks} of {tasks.length} tasks completed ({progress.toFixed(1)}%)
                                </p>
                            </div>

                            {/* Search and Filter */}
                            <div className="space-y-4">
                                <h2 className="text-xl font-semibold text-gray-800">Search & Filter Tasks</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <input
                                        type="text"
                                        value={search.description}
                                        onChange={(e) => setSearch({ ...search, description: e.target.value })}
                                        placeholder="Search by description"
                                        className="p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                                    />
                                    <input
                                        type="text"
                                        value={search.tags}
                                        onChange={(e) => setSearch({ ...search, tags: e.target.value })}
                                        placeholder="Comma-separated tags"
                                        className="p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                                    />
                                    <select
                                        value={search.category_id}
                                        onChange={(e) => setSearch({ ...search, category_id: e.target.value })}
                                        className="p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                                    >
                                        <option value="">All Categories</option>
                                        {categories.map(cat => (
                                            <option key={cat.category_id} value={cat.category_id}>{cat.name}</option>
                                        ))}
                                    </select>
                                    <select
                                        value={search.priority}
                                        onChange={(e) => setSearch({ ...search, priority: e.target.value })}
                                        className="p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                                    >
                                        <option value="">All Priorities</option>
                                        <option value="Urgent">Urgent</option>
                                        <option value="Very high">Very high</option>
                                        <option value="High">High</option>
                                        <option value="Medium">Medium</option>
                                        <option value="Low">Low</option>
                                        <option value="Very low">Very low</option>
                                    </select>
                                    <select
                                        value={search.status}
                                        onChange={(e) => setSearch({ ...search, status: e.target.value })}
                                        className="p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                                    >
                                        <option value="">All Statuses</option>
                                        <option value="Incomplete">Incomplete</option>
                                        <option value="In Progress">In Progress</option>
                                        <option value="Completed">Completed</option>
                                    </select>
                                </div>
                            </div>

                            {/* Task Forms - Side by Side */}
                            <div className="grid grid-cols-2-nested gap-4">
                                {/* Query Form */}
                                <form onSubmit={handleQuerySubmit} className="space-y-2">
                                    <h2 className="text-lg font-semibold text-gray-800">Add Task via Query</h2>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Task Query</label>
                                        <input
                                            type="text"
                                            value={query}
                                            onChange={(e) => setQuery(e.target.value)}
                                            placeholder="e.g., I want to complete my project within 20 days"
                                            className="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors text-sm"
                                            disabled={loading}
                                        />
                                    </div>
                                    <button
                                        type="submit"
                                        className="w-full bg-indigo-600 text-white p-2 rounded-lg hover:bg-indigo-700 transition-colors duration-200 disabled:bg-gray-400 text-sm"
                                        disabled={loading}
                                    >
                                        Add Task
                                    </button>
                                </form>

                                {/* Manual Task Form */}
                                <form onSubmit={handleManualSubmit} className="space-y-2">
                                    <h2 className="text-lg font-semibold text-gray-800">Add Task Manually</h2>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Description</label>
                                        <input
                                            type="text"
                                            value={manualTask.description}
                                            onChange={(e) => setManualTask({ ...manualTask, description: e.target.value })}
                                            placeholder="Task description"
                                            className="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors text-sm"
                                            disabled={loading}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Due Date</label>
                                        <input
                                            type="date"
                                            value={manualTask.due_date}
                                            onChange={(e) => setManualTask({ ...manualTask, due_date: e.target.value })}
                                            placeholder="dd-mm-yyyy"
                                            className="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors text-sm"
                                            disabled={loading}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Category</label>
                                        <select
                                            value={manualTask.category_id}
                                            onChange={(e) => setManualTask({ ...manualTask, category_id: e.target.value })}
                                            className="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors text-sm"
                                            disabled={loading}
                                        >
                                            <option value="">Select Category</option>
                                            {categories.map(cat => (
                                                <option key={cat.category_id} value={cat.category_id}>{cat.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Tags</label>
                                        <input
                                            type="text"
                                            value={manualTask.tags}
                                            onChange={(e) => setManualTask({ ...manualTask, tags: e.target.value })}
                                            placeholder="Comma-separated tags"
                                            className="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors text-sm"
                                            disabled={loading}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Priority</label>
                                        <select
                                            value={manualTask.priority}
                                            onChange={(e) => setManualTask({ ...manualTask, priority: e.target.value })}
                                            className="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors text-sm"
                                            disabled={loading}
                                        >
                                            <option value="Urgent">Urgent</option>
                                            <option value="Very high">Very high</option>
                                            <option value="High">High</option>
                                            <option value="Medium">Medium</option>
                                            <option value="Low">Low</option>
                                            <option value="Very low">Very low</option>
                                        </select>
                                    </div>
                                    <div className="hidden">
                                        <label className="block text-sm font-medium text-gray-700">Status</label>
                                        <select
                                            value={manualTask.status}
                                            onChange={(e) => setManualTask({ ...manualTask, status: e.target.value })}
                                            className="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors text-sm"
                                            disabled={loading}
                                        >
                                            <option value="Incomplete">Incomplete</option>
                                            <option value="In Progress">In Progress</option>
                                            <option value="Completed">Completed</option>
                                        </select>
                                    </div>
                                    <div className="hidden">
                                        <label className="block text-sm font-medium text-gray-700">Insights</label>
                                        <input
                                            type="text"
                                            value={manualTask.insights}
                                            onChange={(e) => setManualTask({ ...manualTask, insights: e.target.value })}
                                            placeholder="Optional insights"
                                            className="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors text-sm"
                                            disabled={loading}
                                        />
                                    </div>
                                    {/* Added Submit Button */}
                                    <button
                                        type="submit"
                                        className="w-full bg-indigo-600 text-white p-2 rounded-lg hover:bg-indigo-700 transition-colors duration-200 disabled:bg-gray-400 text-sm"
                                        disabled={loading}
                                    >
                                        Add Manual Task
                                    </button>
                                </form>
                            </div>
                        </div>

                        {/* Right Main: Task Cards */}
                        <div className="space-y-6">
                            <h2 className="text-2xl font-bold text-gray-800 text-center">Your Tasks</h2>
                            {notification.message && (
                                <div className={`fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white toast ${notification.type === "success" ? "bg-green-500" : "bg-red-500"}`}>
                                    {notification.message}
                                </div>
                            )}
                            {loading && (
                                <div className="fixed inset-0 flex items-center justify-center bg-gray-100 bg-opacity-50">
                                    <div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                                </div>
                            )}
                            {tasks.length === 0 ? (
                                <p className="text-gray-500 text-center">No tasks yet. Add one to get started!</p>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {tasks.map(task => (
                                        <div
                                            key={task.task_id}
                                            className="task-card-enter p-4 bg-white rounded-xl shadow-md hover:shadow-lg transition-all duration-300"
                                        >
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="text-lg font-semibold text-gray-800">{task.description}</h3>
                                                <span
                                                    className={`px-2 py-1 text-xs font-medium rounded-full ${
                                                        task.status === "Completed"
                                                            ? "bg-green-100 text-green-800"
                                                            : task.status === "In Progress"
                                                            ? "bg-yellow-100 text-yellow-800"
                                                            : "bg-red-100 text-red-800"
                                                    }`}
                                                >
                                                    {task.status}
                                                </span>
                                            </div>
                                            {task.category_name && (
                                                <span
                                                    className="inline-block px-2 py-1 text-xs font-medium rounded-full mb-2"
                                                    style={{ backgroundColor: task.category_color, color: "#fff" }}
                                                >
                                                    {task.category_name}
                                                </span>
                                            )}
                                            <p className="text-sm text-gray-600"><strong>Due:</strong> {task.due_date || "None"}</p>
                                            <p className="text-sm text-gray-600"><strong>Tags:</strong> {task.tags.join(", ") || "None"}</p>
                                            <p className="text-sm text-gray-600"><strong>Priority:</strong> {task.priority}</p>
                                            <p className="text-sm text-gray-600"><strong>Insights:</strong> {task.insights || "None"}</p>
                                            <div className="mt-4 flex space-x-2">
                                                <select
                                                    value={task.status}
                                                    onChange={(e) => handleStatusUpdate(task.task_id, e.target.value)}
                                                    className="p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                                                    disabled={loading}
                                                >
                                                    <option value="Incomplete">Incomplete</option>
                                                    <option value="In Progress">In Progress</option>
                                                    <option value="Completed">Completed</option>
                                                </select>
                                                <button
                                                    onClick={() => handleDeleteTask(task.task_id)}
                                                    className="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors duration-200 disabled:bg-gray-400"
                                                    disabled={loading}
                                                >
                                                    Delete
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <footer className="mt-6 text-center text-gray-600 p-4 bg-white bg-opacity-90">
                        <p>DBMS Project © 2025</p>
                    </footer>
                </div>
            );
        }

        function Main() {
            const [isLoggedIn, setIsLoggedIn] = useState(!!localStorage.getItem("token"));

            const handleLogin = () => {
                setIsLoggedIn(true);
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
            };

            return (
                <>
                    {isLoggedIn ? (
                        <App onLogout={handleLogout} />
                    ) : (
                        <Auth onLogin={handleLogin} />
                    )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<Main />);
    </script>
