<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/10.18.0/framer-motion.min.js"></script>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAgklEQVR4AWNABf/+/38GEgBxyACZGEAn4gX2IGsANfgO8xlgO4AN3gW8x4gB4A0QQ8gB6SBoogIArfEGmiCohi4gC4A1+IEtEEhAB4gC4ANcABsE1eA7gA1+AE/ABWQBcABZAFxAFgAXEAWABcQBYAFxAFgAXEAWABcQBYAFxAFgAQCrDAKZdKxF4wAAAABJRU5ErkJggg==">
    <style>
        body {
            background: #0a0a15;
            color: #e0e0ff;
            font-family: 'Orbitron', sans-serif;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Ensure canvas stays behind content */
            filter: blur(2px);
            opacity: 0.8;
            pointer-events: auto; /* Allow mouse events for interactivity */
        }
        #root {
            position: relative;
            z-index: 10; /* Ensure app content is above canvas */
        }
        .glassmorph {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .neon-glow {
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5), 0 0 20px rgba(0, 255, 255, 0.3);
            transition: box-shadow 0.3s ease;
        }
        .neon-glow:hover {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.5);
        }
        .input-holo {
            border: 1px solid rgba(0, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.2);
            color: #e0e0ff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .input-holo:focus {
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.7);
            outline: none;
        }
        .button-holo {
            background: linear-gradient(45deg, #00f6ff, #ff00ff);
            border: none;
            color: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .button-holo:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.9);
        }
        .button-holo:active {
            transform: scale(0.95);
        }
        .task-card {
            perspective: 1000px;
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
        }
        .task-card:hover {
            transform: rotateX(5deg) rotateY(5deg) translateZ(30px);
        }
        .toast {
            animation: popIn 0.3s ease-out, fadeOut 0.3s ease-out 2.7s forwards;
            transform: translateZ(20px);
        }
        @keyframes popIn {
            from { transform: translateX(50px) translateZ(0); opacity: 0; }
            to { transform: translateX(0) translateZ(20px); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .progress-bar {
            background: linear-gradient(45deg, #00f6ff, #ff00ff);
            transition: width 0.5s ease;
        }
        @media (max-width: 768px) {
            .grid-cols-2 {
                grid-template-columns: 1fr;
            }
            .grid-cols-2-nested {
                grid-template-columns: 1fr;
            }
            .task-card:hover {
                transform: scale(1.05);
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="canvas-container"></div>
    <div id="root" className="min-h-screen flex flex-col relative z-10"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Framer Motion setup (unchanged)
        const motion = (window.framerMotion || window.FramerMotion)?.motion;
        if (!motion) {
            console.error('Framer Motion motion object not found. Falling back to regular elements.');
        }
        const AnimatedDiv = motion ? motion.div : 'div';
        const AnimatedButton = motion ? motion.button : 'button';
        const AnimatedInput = motion ? motion.input : 'input';
        const AnimatedSelect = motion ? motion.select : 'select';
        console.log('Framer Motion Global:', window.framerMotion || window.FramerMotion);

        // Updated ThreeBackground Component
        function ThreeBackground() {
            useEffect(() => {
                console.log('ThreeBackground: Initializing');
                // Check WebGL support
                if (!window.WebGLRenderingContext || !document.createElement('canvas').getContext('webgl')) {
                    console.error('ThreeBackground: WebGL not supported');
                    return;
                }

                try {
                    // Initialize Three.js
                    const scene = new THREE.Scene();
                    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                    const renderer = new THREE.WebGLRenderer({ alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    const canvasContainer = document.getElementById('canvas-container');
                    if (canvasContainer) {
                        canvasContainer.appendChild(renderer.domElement);
                        console.log('ThreeBackground: Canvas appended to #canvas-container');
                    } else {
                        console.error('ThreeBackground: #canvas-container not found');
                        return;
                    }

                    // Particle System
                    const particles = new THREE.Group();
                    const particleCount = 300;
                    const particleGeometry = new THREE.SphereGeometry(0.05, 16, 16);
                    const particleMaterial = new THREE.MeshBasicMaterial({ color: 0x00f6ff });
                    for (let i = 0; i < particleCount; i++) {
                        const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                        particle.position.set(
                            (Math.random() - 0.5) * 20,
                            (Math.random() - 0.5) * 20,
                            (Math.random() - 0.5) * 20
                        );
                        particles.add(particle);
                    }
                    scene.add(particles);
                    camera.position.z = 5;

                    // Mouse Interactivity
                    const mouse = { x: 0, y: 0 };
                    const handleMouseMove = (event) => {
                        // Normalize mouse coordinates to [-1, 1]
                        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                    };
                    window.addEventListener('mousemove', handleMouseMove);

                    // Animation Loop
                    const animate = () => {
                        requestAnimationFrame(animate);
                        particles.rotation.y += 0.002;
                        particles.children.forEach(p => {
                            // Base movement
                            p.position.z += Math.sin(p.position.x + Date.now() * 0.001) * 0.01;
                            // Cursor attraction effect
                            const mouseWorldX = mouse.x * 10; // Scale to scene coordinates
                            const mouseWorldY = mouse.y * 10;
                            const dx = mouseWorldX - p.position.x;
                            const dy = mouseWorldY - p.position.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            // Move particles toward cursor if within range
                            if (distance < 5) {
                                p.position.x += dx * 0.01; // Adjust speed
                                p.position.y += dy * 0.01;
                            }
                        });
                        renderer.render(scene, camera);
                    };
                    animate();

                    // Handle Window Resize
                    const handleResize = () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                        console.log('ThreeBackground: Window resized');
                    };
                    window.addEventListener('resize', handleResize);

                    // Cleanup
                    return () => {
                        console.log('ThreeBackground: Cleaning up');
                        window.removeEventListener('resize', handleResize);
                        window.removeEventListener('mousemove', handleMouseMove);
                        if (canvasContainer && renderer.domElement) {
                            canvasContainer.removeChild(renderer.domElement);
                        }
                    };
                } catch (error) {
                    console.error('ThreeBackground: Setup failed:', error);
                }
            }, []);

            // Return null since the canvas is appended directly to #canvas-container
            return null;
        }

        function Auth({ onLogin }) {
            const [activeTab, setActiveTab] = useState("login");
            const [loginData, setLoginData] = useState({ username: "", password: "" });
            const [signupData, setSignupData] = useState({ username: "", email: "", password: "" });
            const [message, setMessage] = useState({ text: "", type: "" });

            const handleLogin = async () => {
                try {
                    const response = await fetch("http://localhost:8000/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(loginData)
                    });
                    console.log('Login response:', response);
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || "Login failed");
                    }
                    const data = await response.json();
                    localStorage.setItem("token", data.token);
                    setMessage({ text: "Login successful! Redirecting...", type: "success" });
                    setTimeout(() => onLogin(data.token), 1000);
                } catch (error) {
                    console.error('Login error:', error);
                    setMessage({ text: error.message, type: "error" });
                }
            };

            const handleSignup = async () => {
                try {
                    const response = await fetch("http://localhost:8000/users/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(signupData)
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || "Signup failed");
                    }
                    const data = await response.json();
                    setMessage({ text: "Signup successful! Please login.", type: "success" });
                    setActiveTab("login");
                } catch (error) {
                    setMessage({ text: error.message, type: "error" });
                }
            };

            return (
                <AnimatedDiv
                    {...(motion ? {
                        initial: { opacity: 0, y: 50 },
                        animate: { opacity: 1, y: 0 },
                        transition: { duration: 0.5 }
                    } : {})}
                    className="max-w-md mx-auto mt-20 p-8 glassmorph rounded-2xl neon-glow"
                >
                    <h1 className="text-3xl font-bold text-cyan-300 text-center mb-6">AI Task Manager</h1>
                    <div className="flex border-b border-cyan-500">
                        <AnimatedButton
                            {...(motion ? {
                                whileHover: { scale: 1.05 },
                                whileTap: { scale: 0.95 }
                            } : {})}
                            className={`flex-1 py-3 text-lg font-semibold ${activeTab === "login" ? "border-b-4 border-cyan-500 text-cyan-300" : "text-gray-400 hover:text-cyan-200"}`}
                            onClick={() => setActiveTab("login")}
                        >
                            Login
                        </AnimatedButton>
                        <AnimatedButton
                            {...(motion ? {
                                whileHover: { scale: 1.05 },
                                whileTap: { scale: 0.95 }
                            } : {})}
                            className={`flex-1 py-3 text-lg font-semibold ${activeTab === "signup" ? "border-b-4 border-cyan-500 text-cyan-300" : "text-gray-400 hover:text-cyan-200"}`}
                            onClick={() => setActiveTab("signup")}
                        >
                            Signup
                        </AnimatedButton>
                    </div>

                    {message.text && (
                        <AnimatedDiv
                            {...(motion ? {
                                initial: { x: 50, opacity: 0 },
                                animate: { x: 0, opacity: 1 }
                            } : {})}
                            className={`mt-4 p-3 rounded-lg text-white toast ${message.type === "success" ? "bg-green-500" : "bg-red-500"}`}
                        >
                            {message.text}
                        </AnimatedDiv>
                    )}

                    {activeTab === "login" ? (
                        <div className="mt-6 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-cyan-200">Username</label>
                                <AnimatedInput
                                    {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                    type="text"
                                    value={loginData.username}
                                    onChange={(e) => setLoginData({ ...loginData, username: e.target.value })}
                                    placeholder="Enter your username"
                                    className="w-full p-3 rounded-lg input-holo"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-cyan-200">Password</label>
                                <AnimatedInput
                                    {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                    type="password"
                                    value={loginData.password}
                                    onChange={(e) => setLoginData({ ...loginData, password: e.target.value })}
                                    placeholder="Enter your password"
                                    className="w-full p-3 rounded-lg input-holo"
                                />
                            </div>
                            <AnimatedButton
                                {...(motion ? {
                                    whileHover: { scale: 1.05 },
                                    whileTap: { scale: 0.95 }
                                } : {})}
                                onClick={handleLogin}
                                className="w-full p-3 rounded-lg button-holo"
                            >
                                Login
                            </AnimatedButton>
                        </div>
                    ) : (
                        <div className="mt-6 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-cyan-200">Username</label>
                                <AnimatedInput
                                    {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                    type="text"
                                    value={signupData.username}
                                    onChange={(e) => setSignupData({ ...signupData, username: e.target.value })}
                                    placeholder="Choose a username"
                                    className="w-full p-3 rounded-lg input-holo"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-cyan-200">Email</label>
                                <AnimatedInput
                                    {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                    type="email"
                                    value={signupData.email}
                                    onChange={(e) => setSignupData({ ...signupData, email: e.target.value })}
                                    placeholder="Enter your email"
                                    className="w-full p-3 rounded-lg input-holo"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-cyan-200">Password</label>
                                <AnimatedInput
                                    {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                    type="password"
                                    value={signupData.password}
                                    onChange={(e) => setSignupData({ ...signupData, password: e.target.value })}
                                    placeholder="Choose a password"
                                    className="w-full p-3 rounded-lg input-holo"
                                />
                            </div>
                            <AnimatedButton
                                {...(motion ? {
                                    whileHover: { scale: 1.05 },
                                    whileTap: { scale: 0.95 }
                                } : {})}
                                onClick={handleSignup}
                                className="w-full p-3 rounded-lg button-holo"
                            >
                                Signup
                            </AnimatedButton>
                        </div>
                    )}
                </AnimatedDiv>
            );
        }

        function App({ onLogout }) {
            const [query, setQuery] = useState("");
            const [tasks, setTasks] = useState([]);
            const [manualTask, setManualTask] = useState({
                description: "",
                due_date: "",
                category_id: "",
                tags: "",
                priority: "Medium",
                status: "Incomplete",
                insights: ""
            });
            const [categories, setCategories] = useState([]);
            const [search, setSearch] = useState({
                description: "",
                tags: "",
                category_id: "",
                priority: "",
                status: ""
            });
            const [groqStatus, setGroqStatus] = useState("Checking...");
            const [notification, setNotification] = useState({ message: "", type: "" });
            const [loading, setLoading] = useState(false);
            const username = localStorage.getItem("token");

            const showNotification = (message, type) => {
                setNotification({ message, type });
                setTimeout(() => setNotification({ message: "", type: "" }), 3000);
            };

            const fetchTasks = async () => {
                setLoading(true);
                try {
                    const response = await fetch("http://localhost:8000/tasks", {
                        headers: { Authorization: `Bearer ${username}` }
                    });
                    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                    const data = await response.json();
                    setTasks(data);
                } catch (error) {
                    showNotification(`Error fetching tasks: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const fetchCategories = async () => {
                try {
                    const response = await fetch("http://localhost:8000/categories");
                    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                    const data = await response.json();
                    setCategories(data);
                } catch (error) {
                    console.error("Error fetching categories:", error);
                }
            };

            const checkGroqHealth = async () => {
                try {
                    const response = await fetch("http://localhost:8000/test-groq");
                    if (response.status === 404) {
                        setGroqStatus("Groq API available");
                        return;
                    }
                    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                    const data = await response.json();
                    setGroqStatus("Groq API is working");
                } catch (error) {
                    setGroqStatus("Groq API not available");
                    showNotification(`Groq health check failed: ${error.message}`, "error");
                }
            };

            const searchTasks = async () => {
                setLoading(true);
                try {
                    const response = await fetch("http://localhost:8000/tasks/search", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            Authorization: `Bearer ${username}`
                        },
                        body: JSON.stringify({
                            ...search,
                            tags: search.tags.split(",").map(tag => tag.trim()).filter(tag => tag),
                            category_id: search.category_id ? parseInt(search.category_id) : null
                        })
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `HTTP error: ${response.status}`);
                    }
                    const data = await response.json();
                    setTasks(data);
                } catch (error) {
                    showNotification(`Error searching tasks: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchTasks();
                fetchCategories();
                checkGroqHealth();
            }, []);

            useEffect(() => {
                searchTasks();
            }, [search]);

            const handleQuerySubmit = async (e) => {
                e.preventDefault();
                if (!query.trim()) {
                    showNotification("Query is required", "error");
                    return;
                }
                setLoading(true);
                try {
                    const response = await fetch("http://localhost:8000/tasks/query", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            Authorization: `Bearer ${username}`
                        },
                        body: JSON.stringify({ query })
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `HTTP error: ${response.status}`);
                    }
                    const data = await response.json();
                    setQuery("");
                    showNotification("Task created successfully!", "success");
                    fetchTasks();
                } catch (error) {
                    showNotification(`Error creating task: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleManualSubmit = async (e) => {
                e.preventDefault();
                if (!manualTask.description.trim()) {
                    showNotification("Description is required", "error");
                    return;
                }
                if (manualTask.due_date && !/^\d{4}-\d{2}-\d{2}$/.test(manualTask.due_date)) {
                    showNotification("Due date must be in YYYY-MM-DD format", "error");
                    return;
                }
                setLoading(true);
                try {
                    const response = await fetch("http://localhost:8000/tasks/manual", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            Authorization: `Bearer ${username}`
                        },
                        body: JSON.stringify({
                            ...manualTask,
                            tags: manualTask.tags.split(",").map(tag => tag.trim()).filter(tag => tag),
                            due_date: manualTask.due_date || null,
                            category_id: manualTask.category_id ? parseInt(manualTask.category_id) : null
                        })
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `HTTP error: ${response.status}`);
                    }
                    const data = await response.json();
                    setManualTask({
                        description: "",
                        due_date: "",
                        category_id: "",
                        tags: "",
                        priority: "Medium",
                        status: "Incomplete",
                        insights: ""
                    });
                    showNotification("Manual task created successfully!", "success");
                    fetchTasks();
                } catch (error) {
                    showNotification(`Error creating manual task: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleStatusUpdate = async (taskId, status) => {
                const validStatuses = ["Incomplete", "In Progress", "Completed"];
                if (!validStatuses.includes(status)) {
                    showNotification(`Invalid status: ${status}`, "error");
                    return;
                }
                setLoading(true);
                try {
                    const response = await fetch(`http://localhost:8000/tasks/${taskId}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                            Authorization: `Bearer ${username}`
                        },
                        body: JSON.stringify({ status })
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `HTTP error: ${response.status}`);
                    }
                    const data = await response.json();
                    showNotification(`Task ${taskId} status updated!`, "success");
                    fetchTasks();
                } catch (error) {
                    showNotification(`Error updating task: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteTask = async (taskId) => {
                if (!window.confirm(`Are you sure you want to delete task ${taskId}?`)) return;
                setLoading(true);
                try {
                    const response = await fetch(`http://localhost:8000/tasks/${taskId}`, {
                        method: "DELETE",
                        headers: { Authorization: `Bearer ${username}` }
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `HTTP error: ${response.status}`);
                    }
                    showNotification(`Task ${taskId} deleted!`, "success");
                    fetchTasks();
                } catch (error) {
                    showNotification(`Error deleting task: ${error.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem("token");
                onLogout();
            };

            const completedTasks = tasks.filter(task => task.status === "Completed").length;
            const progress = tasks.length > 0 ? (completedTasks / tasks.length) * 100 : 0;

            return (
                <div className="flex flex-col min-h-screen relative z-10">
                    <ThreeBackground />
                    <AnimatedDiv
                        {...(motion ? {
                            initial: { y: -100 },
                            animate: { y: 0 },
                            transition: { duration: 0.5 }
                        } : {})}
                        className="glassmorph p-6 flex justify-between items-center neon-glow"
                    >
                        <div>
                            <h1 className="text-4xl font-bold text-cyan-300">AI Task Manager</h1>
                            <p className="text-cyan-200">Powered by Groq API • Status: {groqStatus} • User: {username}</p>
                        </div>
                        <AnimatedButton
                            {...(motion ? {
                                whileHover: { scale: 1.05 },
                                whileTap: { scale: 0.95 }
                            } : {})}
                            onClick={handleLogout}
                            className="px-4 py-2 button-holo rounded-lg"
                        >
                            Logout
                        </AnimatedButton>
                    </AnimatedDiv>

                    <div className="flex-1 grid grid-cols-2 gap-6 p-6">
                        <AnimatedDiv
                            {...(motion ? {
                                initial: { x: -100, opacity: 0 },
                                animate: { x: 0, opacity: 1 },
                                transition: { duration: 0.5 }
                            } : {})}
                            className="glassmorph rounded-2xl p-6 space-y-6 neon-glow"
                        >
                            <div>
                                <h3 className="text-xl font-semibold text-cyan-200 mb-2">Task Progress</h3>
                                <div className="w-full bg-gray-800 rounded-full h-6">
                                    <AnimatedDiv
                                        {...(motion ? {
                                            animate: { width: `${progress}%` },
                                            transition: { duration: 0.5 }
                                        } : { style: { width: `${progress}%` } })}
                                        className="h-6 rounded-full progress-bar"
                                    ></AnimatedDiv>
                                </div>
                                <p className="text-sm text-cyan-200 mt-1">
                                    {completedTasks} of {tasks.length} tasks completed ({progress.toFixed(1)}%)
                                </p>
                            </div>

                            <div className="space-y-4">
                                <h2 className="text-xl font-semibold text-cyan-200">Search & Filter Tasks</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <AnimatedInput
                                        {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                        type="text"
                                        value={search.description}
                                        onChange={(e) => setSearch({ ...search, description: e.target.value })}
                                        placeholder="Search by description"
                                        className="p-2 rounded-lg input-holo"
                                    />
                                    <AnimatedInput
                                        {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                        type="text"
                                        value={search.tags}
                                        onChange={(e) => setSearch({ ...search, tags: e.target.value })}
                                        placeholder="Comma-separated tags"
                                        className="p-2 rounded-lg input-holo"
                                    />
                                    <AnimatedSelect
                                        {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                        value={search.category_id}
                                        onChange={(e) => setSearch({ ...search, category_id: e.target.value })}
                                        className="p-2 rounded-lg input-holo"
                                    >
                                        <option value="">All Categories</option>
                                        {categories.map(cat => (
                                            <option key={cat.category_id} value={cat.category_id}>{cat.name}</option>
                                        ))}
                                    </AnimatedSelect>
                                    <AnimatedSelect
                                        {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                        value={search.priority}
                                        onChange={(e) => setSearch({ ...search, priority: e.target.value })}
                                        className="p-2 rounded-lg input-holo"
                                    >
                                        <option value="">All Priorities</option>
                                        <option value="Urgent">Urgent</option>
                                        <option value="Very high">Very high</option>
                                        <option value="High">High</option>
                                        <option value="Medium">Medium</option>
                                        <option value="Low">Low</option>
                                        <option value="Very low">Very low</option>
                                    </AnimatedSelect>
                                    <AnimatedSelect
                                        {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                        value={search.status}
                                        onChange={(e) => setSearch({ ...search, status: e.target.value })}
                                        className="p-2 rounded-lg input-holo"
                                    >
                                        <option value="">All Statuses</option>
                                        <option value="Incomplete">Incomplete</option>
                                        <option value="In Progress">In Progress</option>
                                        <option value="Completed">Completed</option>
                                    </AnimatedSelect>
                                </div>
                            </div>

                            <div className="grid grid-cols-2-nested gap-4">
                                <form onSubmit={handleQuerySubmit} className="space-y-2">
                                    <h2 className="text-lg font-semibold text-cyan-200">Add Task via Query</h2>
                                    <div>
                                        <label className="block text-sm font-medium text-cyan-200">Task Query</label>
                                        <AnimatedInput
                                            {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                            type="text"
                                            value={query}
                                            onChange={(e) => setQuery(e.target.value)}
                                            placeholder="e.g., I want to complete my project within 20 days"
                                            className="w-full p-2 rounded-lg input-holo text-sm"
                                            disabled={loading}
                                        />
                                    </div>
                                    <AnimatedButton
                                        {...(motion ? {
                                            whileHover: { scale: 1.05 },
                                            whileTap: { scale: 0.95 }
                                        } : {})}
                                        type="submit"
                                        className="w-full p-2 rounded-lg button-holo text-sm"
                                        disabled={loading}
                                    >
                                        Add Task
                                    </AnimatedButton>
                                </form>

                                <form onSubmit={handleManualSubmit} className="space-y-2">
                                    <h2 className="text-lg font-semibold text-cyan-200">Add Task Manually</h2>
                                    <div>
                                        <label className="block text-sm font-medium text-cyan-200">Description</label>
                                        <AnimatedInput
                                            {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                            type="text"
                                            value={manualTask.description}
                                            onChange={(e) => setManualTask({ ...manualTask, description: e.target.value })}
                                            placeholder="Task description"
                                            className="w-full p-2 rounded-lg input-holo text-sm"
                                            disabled={loading}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-cyan-200">Due Date</label>
                                        <AnimatedInput
                                            {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                            type="date"
                                            value={manualTask.due_date}
                                            onChange={(e) => setManualTask({ ...manualTask, due_date: e.target.value })}
                                            placeholder="dd-mm-yyyy"
                                            className="w-full p-2 rounded-lg input-holo text-sm"
                                            disabled={loading}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-cyan-200">Category</label>
                                        <AnimatedSelect
                                            {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                            value={manualTask.category_id}
                                            onChange={(e) => setManualTask({ ...manualTask, category_id: e.target.value })}
                                            className="w-full p-2 rounded-lg input-holo text-sm"
                                            disabled={loading}
                                        >
                                            <option value="">Select Category</option>
                                            {categories.map(cat => (
                                                <option key={cat.category_id} value={cat.category_id}>{cat.name}</option>
                                            ))}
                                        </AnimatedSelect>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-cyan-200">Tags</label>
                                        <AnimatedInput
                                            {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                            type="text"
                                            value={manualTask.tags}
                                            onChange={(e) => setManualTask({ ...manualTask, tags: e.target.value })}
                                            placeholder="Comma-separated tags"
                                            className="w-full p-2 rounded-lg input-holo text-sm"
                                            disabled={loading}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-cyan-200">Priority</label>
                                        <AnimatedSelect
                                            {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                            value={manualTask.priority}
                                            onChange={(e) => setManualTask({ ...manualTask, priority: e.target.value })}
                                            className="w-full p-2 rounded-lg input-holo text-sm"
                                            disabled={loading}
                                        >
                                            <option value="Urgent">Urgent</option>
                                            <option value="Very high">Very high</option>
                                            <option value="High">High</option>
                                            <option value="Medium">Medium</option>
                                            <option value="Low">Low</option>
                                            <option value="Very low">Very low</option>
                                        </AnimatedSelect>
                                    </div>
                                    <div className="hidden">
                                        <label className="block text-sm font-medium text-cyan-200">Status</label>
                                        <AnimatedSelect
                                            {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                            value={manualTask.status}
                                            onChange={(e) => setManualTask({ ...manualTask, status: e.target.value })}
                                            className="w-full p-2 rounded-lg input-holo text-sm"
                                            disabled={loading}
                                        >
                                            <option value="Incomplete">Incomplete</option>
                                            <option value="In Progress">In Progress</option>
                                            <option value="Completed">Completed</option>
                                        </AnimatedSelect>
                                    </div>
                                    <div className="hidden">
                                        <label className="block text-sm font-medium text-cyan-200">Insights</label>
                                        <AnimatedInput
                                            {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                            type="text"
                                            value={manualTask.insights}
                                            onChange={(e) => setManualTask({ ...manualTask, insights: e.target.value })}
                                            placeholder="Optional insights"
                                            className="w-full p-2 rounded-lg input-holo text-sm"
                                            disabled={loading}
                                        />
                                    </div>
                                    <AnimatedButton
                                        {...(motion ? {
                                            whileHover: { scale: 1.05 },
                                            whileTap: { scale: 0.95 }
                                        } : {})}
                                        type="submit"
                                        className="w-full p-2 rounded-lg button-holo text-sm"
                                        disabled={loading}
                                    >
                                        Add Manual Task
                                    </AnimatedButton>
                                </form>
                            </div>
                        </AnimatedDiv>

                        <div className="space-y-6">
                            <h2 className="text-2xl font-bold text-cyan-300 text-center">Your Tasks</h2>
                            {notification.message && (
                                <AnimatedDiv
                                    {...(motion ? {
                                        initial: { x: 50, opacity: 0 },
                                        animate: { x: 0, opacity: 1 }
                                    } : {})}
                                    className={`fixed top-4 right-4 px-6 py-3 rounded-lg text-white toast ${notification.type === "success" ? "bg-green-500" : "bg-red-500"}`}
                                >
                                    {notification.message}
                                </AnimatedDiv>
                            )}
                            {loading && (
                                <AnimatedDiv
                                    {...(motion ? {
                                        initial: { opacity: 0 },
                                        animate: { opacity: 1 }
                                    } : {})}
                                    className="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-50"
                                >
                                    <div className="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin" />
                                </AnimatedDiv>
                            )}
                            {tasks.length === 0 ? (
                                <p className="text-cyan-200 text-center">No tasks yet. Add one to get started!</p>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {tasks.map(task => (
                                        <AnimatedDiv
                                            key={task.task_id}
                                            {...(motion ? {
                                                initial: { opacity: 0, rotateY: 90 },
                                                animate: { opacity: 1, rotateY: 0 },
                                                exit: { opacity: 0, rotateY: -90 },
                                                transition: { duration: 0.5 }
                                            } : {})}
                                            className="task-card p-4 glassmorph rounded-xl neon-glow"
                                        >
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="text-lg font-semibold text-cyan-200">{task.description}</h3>
                                                <span
                                                    className={`px-2 py-1 text-xs font-medium rounded-full ${
                                                        task.status === "Completed"
                                                            ? "bg-green-500 text-white"
                                                            : task.status === "In Progress"
                                                            ? "bg-yellow-500 text-black"
                                                            : "bg-red-500 text-white"
                                                    }`}
                                                >
                                                    {task.status}
                                                </span>
                                            </div>
                                            {task.category_name && (
                                                <span
                                                    className="inline-block px-2 py-1 text-xs font-medium rounded-full mb-2"
                                                    style={{ backgroundColor: task.category_color, color: "#fff" }}
                                                >
                                                    {task.category_name}
                                                </span>
                                            )}
                                            <p className="text-sm text-cyan-200"><strong>Due:</strong> {task.due_date || "None"}</p>
                                            <p className="text-sm text-cyan-200"><strong>Tags:</strong> {task.tags.join(", ") || "None"}</p>
                                            <p className="text-sm text-cyan-200"><strong>Priority:</strong> {task.priority}</p>
                                            <p className="text-sm text-cyan-200"><strong>Insights:</strong> {task.insights || "None"}</p>
                                            <div className="mt-4 flex space-x-2">
                                                <AnimatedSelect
                                                    {...(motion ? { whileFocus: { scale: 1.02 } } : {})}
                                                    value={task.status}
                                                    onChange={(e) => handleStatusUpdate(task.task_id, e.target.value)}
                                                    className="p-2 rounded-lg input-holo"
                                                    disabled={loading}
                                                >
                                                    <option value="Incomplete">Incomplete</option>
                                                    <option value="In Progress">In Progress</option>
                                                    <option value="Completed">Completed</option>
                                                </AnimatedSelect>
                                                <AnimatedButton
                                                    {...(motion ? {
                                                        whileHover: { scale: 1.05 },
                                                        whileTap: { scale: 0.95 }
                                                    } : {})}
                                                    onClick={() => handleDeleteTask(task.task_id)}
                                                    className="px-3 py-1 button-holo rounded-lg"
                                                    disabled={loading}
                                                >
                                                    Delete
                                                </AnimatedButton>
                                            </div>
                                        </AnimatedDiv>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <AnimatedDiv
                        {...(motion ? {
                            initial: { y: 100 },
                            animate: { y: 0 },
                            transition: { duration: 0.5 }
                        } : {})}
                        className="mt-6 text-center text-cyan-200 p-4 glassmorph neon-glow"
                    >
                        <p>DBMS Project © 2025</p>
                    </AnimatedDiv>
                </div>
            );
        }

        function Main() {
            const [isLoggedIn, setIsLoggedIn] = useState(!!localStorage.getItem("token"));

            const handleLogin = () => {
                setIsLoggedIn(true);
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
            };

            return (
                <>
                    {isLoggedIn ? (
                        <App onLogout={handleLogout} />
                    ) : (
                        <Auth onLogin={handleLogin} />
                    )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<Main />);
    </script>
</body>
</html>
